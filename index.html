<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>過去問ノック</title>
<script>/* 旧URLで共有されたSCの成績リンクはSC版へ転送 */ if(location.hash.startsWith("#p=")) location.replace("sc.html"+location.hash);</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eaeef3; --line:#dde3ea; --line-strong:#c9d2dd;
  --fg:#121a24; --muted:#5e6b7a; --accent:#2847c9; --accent-soft:#e7ecfb;
  --good:#12805c; --good-soft:#e1f2ea; --warn:#a96400; --bad:#c2362f;
  --shadow:0 1px 2px rgba(18,26,36,.05),0 4px 16px -8px rgba(18,26,36,.10);
  --f-display:"Zen Kaku Gothic New","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#141b23; --sunk:#1b2430; --line:#253140; --line-strong:#344255;
  --fg:#e6ebf1; --muted:#8b98a8; --accent:#7c9bff; --accent-soft:#1c2747;
  --good:#4cc38a; --good-soft:#15302a; --warn:#e6a23c; --bad:#f07167;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#141b23; --sunk:#1b2430; --line:#253140; --line-strong:#344255;
  --fg:#e6ebf1; --muted:#8b98a8; --accent:#7c9bff; --accent-soft:#1c2747;
  --good:#4cc38a; --good-soft:#15302a; --warn:#e6a23c; --bad:#f07167;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 56px}
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.mark{width:44px;height:44px;border-radius:11px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:20px;flex:none}
h1{font-family:var(--f-display);font-weight:900;font-size:24px;margin:0;line-height:1.2;letter-spacing:.02em}
.sub{font-size:12px;color:var(--muted);letter-spacing:.06em}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{display:flex;flex-direction:column;gap:18px;min-height:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ch{display:flex;align-items:center;gap:12px}
.badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:16px;background:var(--accent-soft);color:var(--accent);flex:none}
.ct{font-family:var(--f-display);font-weight:900;font-size:19px;line-height:1.25}
.cs{font-size:12px;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.num{background:var(--sunk);border-radius:10px;padding:8px 10px}
.num b{display:block;font-family:var(--f-mono);font-size:18px;line-height:1.2}
.num b small{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}
.num span{font-size:11px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.go{margin-top:auto;font-weight:700;color:var(--accent);font-size:14px}
.go::after{content:" →"}
h2{font-family:var(--f-display);font-weight:900;font-size:18px;margin:34px 0 4px}
.note{font-size:12px;color:var(--muted);margin:0 0 12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:13px;padding:6px 16px;border-radius:8px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp{padding:8px 14px;font-size:12px;font-weight:700;color:var(--muted);background:var(--sunk);letter-spacing:.04em}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(var(--cols),minmax(0,1fr));gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.grp+.row{border-top:0}
.lbl{font-size:14px;font-weight:500;min-width:0}
.cell{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
.cell .k{font-size:11px;color:var(--muted);min-width:3.2em}
.cnt{font-family:var(--f-mono);font-weight:700;font-size:15px}
.cnt.zero{color:var(--line-strong);font-weight:500}
.pct{font-family:var(--f-mono);font-size:12px}
.pct.g{color:var(--good)}.pct.w{color:var(--warn)}.pct.b{color:var(--bad)}
.cells{display:contents}
.empty{padding:18px 14px;color:var(--muted);font-size:13px}
footer{margin-top:30px;font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .cards{grid-template-columns:1fr}
  .row{grid-template-columns:1fr;gap:4px}
  .cells{display:flex;gap:6px 18px;flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true">ノ</div>
    <div>
      <h1>過去問ノック</h1>
      <div class="sub">IPA 情報処理技術者試験の過去問演習</div>
    </div>
  </header>

  <div class="cards">
    <a class="card" href="sc.html" id="cardSC">
      <div class="ch"><div class="badge">SC</div><div><div class="ct">情報処理安全確保支援士</div><div class="cs">午前I・午前II ／ 19回分</div></div></div>
      <div class="go">SCを開く</div>
    </a>
    <a class="card" href="fe/" id="cardFE">
      <div class="ch"><div class="badge">FE</div><div><div class="ct">基本情報技術者</div><div class="cs">科目A・科目B・免除試験・旧午前</div></div></div>
      <div class="go">FEを開く</div>
    </a>
  </div>

  <footer>記録はこのブラウザに保存されています。問題の出典：IPA 公開の過去問題。</footer>
</div>

</body>
</html>
